global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 1m
    timeout server 1m

resolvers docker
    nameserver dns 127.0.0.11:53
    timeout resolve 2s
    timeout retry 1s
    hold valid 30s

frontend addresy_https
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl addresy_api req.ssl_sni -i api.adresy.app
    use_backend addresy_api_backend if addresy_api
    default_backend denied_backend

backend addresy_api_backend
    server addresy_api api.adresy.app:443 check resolvers docker resolve-prefer ipv4 init-addr libc,none

backend denied_backend
    server denied 127.0.0.1:1
