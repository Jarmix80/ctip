<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>CTIP – logowanie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/static/root/favicon.svg">
    <link rel="stylesheet" href="/static/root/root.css">
    <script defer src="/static/root/root.js"></script>
  </head>
  <body>
    <main class="root-hero">
      <div id="root-login-card" class="root-card">
        <div class="root-logo">Ksero-Partner</div>
        <h1>System CTIP – logowanie</h1>
        <p>
          Zaloguj się, aby przejść do dostępnych sekcji systemu.
        </p>

        <form id="root-login-form" class="root-form" autocomplete="on">
          <label for="root-email">E-mail</label>
          <input id="root-email" name="email" type="email" required autocomplete="username">

          <label for="root-password">Hasło</label>
          <input id="root-password" name="password" type="password" required autocomplete="current-password">

          <label class="root-remember">
            <input id="root-remember" name="remember" type="checkbox" checked>
            Zapamiętaj sesję
          </label>

          <button id="root-login-submit" class="root-btn" type="submit">Zaloguj</button>
        </form>
        <p id="root-login-error" class="root-error" hidden></p>
      </div>
    </main>
  </body>
</html>
